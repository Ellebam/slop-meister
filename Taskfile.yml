version: '3'

# Targets live in taskfiles/ by area and are flattened here, so public names stay short.
includes:
  check:
    taskfile: taskfiles/check.yml
    flatten: true
  render:
    taskfile: taskfiles/render.yml
    flatten: true
  sandbox:
    taskfile: taskfiles/sandbox.yml
    flatten: true
  session:
    taskfile: taskfiles/session.yml
    flatten: true
  vault:
    taskfile: taskfiles/vault.yml
    flatten: true
  workstation:
    taskfile: taskfiles/workstation.yml
    flatten: true
  host:
    taskfile: taskfiles/host.yml

tasks:
  default:
    silent: true
    cmds:
      - task --list
