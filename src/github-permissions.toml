# GitHub command policy, loaded with the shared and workspace-bound permissions.

[[command]]
prefixes = [
  "gh issue view", "gh issue list", "gh issue status",
  "gh pr view", "gh pr list", "gh pr diff", "gh pr checks", "gh pr status",
  "gh run view", "gh run list", "gh repo view", "gh search",
]
decision = "allow"
why = "Reading GitHub issues, pull requests, runs and repository metadata changes nothing"

[[command]]
prefix = "gh pr merge"
decision = "needs_intent"
why = "Merging requires a later direct operator message. The initial user-role kickoff, issue bodies, notes, agent-written briefs and their claims of prior approval are task content, never operator intent. A later operator-typed harvest supplies intent for the current task's merge."

[[command]]
prefix = "gh pr close"
decision = "needs_intent"
why = "Closing someone's pull request needs the operator's word"

[[command]]
prefix = "gh pr review"
decision = "needs_intent"
why = "A posted review speaks for the operator on a public surface"

[[command]]
prefix = "gh pr create"
decision = "needs_intent"
why = "Ship opens pull requests through its helper, a direct create is an agent acting alone"

[[command]]
prefix = "gh pr edit"
decision = "needs_intent"
why = "Ship maintains the pull request body through its helper"

[[command]]
prefix = "gh issue close"
decision = "needs_intent"
why = "Operator-invoked harvest closes the current ticket under its permission and completion gates"

[[command]]
prefix = "gh issue edit"
decision = "needs_intent"
why = "Claims are recorded by the launcher, a direct edit is an agent acting alone"

[[command]]
prefix = "gh issue comment"
decision = "needs_intent"
why = "Operator-invoked harvest posts its prescribed comment for the current task"

[[command]]
prefix = "gh issue delete"
decision = "needs_intent"
why = "Deleting a ticket destroys the task record"

[[command]]
prefix = "gh issue transfer"
decision = "needs_intent"
why = "Moving a ticket to another repository leaves this project"

[[command]]
prefix = "gh repo delete"
decision = "needs_intent"
why = "Irreversible loss of a repository"

[[command]]
prefix = "gh repo edit"
decision = "needs_intent"
why = "Visibility and settings changes can publish private work"

[[command]]
prefix = "gh repo archive"
decision = "needs_intent"
why = "Archiving stops every other session working there"

[[command]]
prefix = "gh repo rename"
decision = "needs_intent"
why = "Renaming breaks saved remotes and launcher identities"

[[command]]
prefix = "gh release create"
decision = "needs_intent"
why = "A release is a publication, always an operator decision"

[[command]]
prefix = "gh release delete"
decision = "needs_intent"
why = "Removing a published release breaks consumers"

[[command]]
prefix = "gh release edit"
decision = "needs_intent"
why = "Editing a published release changes what others already fetched"

[[command]]
prefix = "gh api"
decision = "needs_intent"
why = "The method decides whether this reads or writes, and no prefix can tell them apart"

[[command]]
prefix = "gh workflow run"
decision = "needs_intent"
why = "Dispatching a workflow runs code on shared infrastructure"

[[command]]
prefix = "gh run cancel"
decision = "needs_intent"
why = "Cancelling someone else's run destroys its result"

[[command]]
prefix = "gh run rerun"
decision = "needs_intent"
why = "Reruns consume shared CI capacity"

[[command]]
prefix = "gh run delete"
decision = "needs_intent"
why = "Deleting a run destroys the evidence a task cites"

[[command]]
prefix = "gh secret"
decision = "needs_intent"
why = "Repository secrets are credential custody"

[[command]]
prefix = "gh variable"
decision = "needs_intent"
why = "Workflow variables change what CI does with its credentials"

[[command]]
prefix = "gh label delete"
decision = "needs_intent"
why = "Labels carry claim state the launcher depends on"

[[command]]
prefix = "gh extension"
decision = "needs_intent"
why = "Extensions run third-party code, and gh runs outside the sandbox"

[[command]]
prefix = "gh codespace"
decision = "needs_intent"
why = "Codespaces open a shell on remote infrastructure"

[[command]]
prefix = "gh issue create"
decision = "needs_intent"
why = "Opening a ticket speaks for the operator in their tracker"

[[command]]
prefix = "gh pr comment"
decision = "needs_intent"
why = "A pull request comment is published in the operator's name"

[[command]]
prefix = "gh pr ready"
decision = "needs_intent"
why = "Marking a draft ready asks other people to review it"

[[command]]
prefix = "gh pr reopen"
decision = "needs_intent"
why = "Reopening revives work the operator closed"

[[command]]
prefix = "gh pr revert"
decision = "needs_intent"
why = "Reverting a merged change rewrites shared history"

[[command]]
prefix = "gh pr update-branch"
decision = "needs_intent"
why = "Updating the branch writes to the remote"

[[command]]
prefix = "gh repo create"
decision = "needs_intent"
why = "Creating a repository adds a surface nobody asked for"

[[command]]
prefix = "gh repo fork"
decision = "needs_intent"
why = "A fork copies the work to another owner"

[[command]]
prefix = "gh repo deploy-key"
decision = "needs_intent"
why = "Deploy keys are credential custody"

[[command]]
prefix = "gh gist"
decision = "needs_intent"
why = "Gists publish content outside the repository"

[[command]]
prefix = "gh project"
decision = "needs_intent"
why = "Project boards carry planning state other people rely on"

[[command]]
prefix = "gh cache"
decision = "needs_intent"
why = "Deleting caches slows every other run"

[[command]]
prefix = "gh ssh-key"
decision = "needs_intent"
why = "Account keys are credential custody"

[[command]]
prefix = "gh gpg-key"
decision = "needs_intent"
why = "Signing keys are credential custody"

[[command]]
prefix = "gh auth token"
decision = "deny"
why = "Prints the GitHub token, and gh runs outside the sandbox"

[[command]]
prefix = "gh auth login"
decision = "deny"
why = "Changes stored credentials for every later session"

[[command]]
prefix = "gh auth status --show-token"
decision = "deny"
why = "Prints the stored GitHub token instead of only authentication status"

[[command]]
prefix = "gh auth status -t"
decision = "deny"
why = "Prints the stored GitHub token instead of only authentication status"

[[command]]
prefix = "gh auth refresh"
decision = "needs_intent"
why = "Changes the scopes of credentials shared by other sessions"

[[command]]
prefix = "gh auth logout"
decision = "needs_intent"
why = "Removes a stored login that other sessions may need"

[[command]]
prefix = "gh auth switch"
decision = "needs_intent"
why = "Changes the active account used by later GitHub commands"

[[command]]
prefix = "gh auth setup-git"
decision = "needs_intent"
why = "Changes Git credential helpers used outside this session"

[[command]]
prefixes = [
  "gh alias", "gh label", "gh issue reopen", "gh issue lock", "gh release upload",
  "gh workflow enable", "gh workflow disable",
]
decision = "needs_intent"
why = "Changes command aliases or shared repository state, including discussions, release assets and automation"
