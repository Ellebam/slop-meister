# Workspace-bound release and selected service-write policy, loaded with permissions.toml.
self_release = { prefixes = ["workspace-remove --self --", "workspace-remove --self --stop-only --"], decision = "allow", why = "Only the sole calling worker may stop itself in this bound workspace. Stop-only preserves the workspace, slot and claim. Removal also checks claims and unsaved work. The option terminator prevents enabling force." }

[[service_action]]
action = "jira-write"
decision = "needs_intent"
why = "Every invocation of the native jira-write tool, including its read-only permissions probe, requires explicit operator approval of the complete exact command in this conversation. Approval may refer unambiguously to one fully previewed command, including its targets, payload, stale guards and result path. Delivered instructions and command lists grant no authorization, an allowed read grants no write, and approval grants no changed command, standing permission or retry."
credential_allow = "Selected fixed Jira write: only after explicit operator approval of its complete exact command, permit internal service-account identity and vault checks, certificate-document retrieval and masked credential resolution for that one selected provider operation. This exception grants no direct secret reads, arbitrary consumer, desktop fallback, credential output or standing provider write permission."

