action = "confluence-write"
decision = "needs_intent"
why = "Every invocation of the native confluence-write tool, including its read-only permissions probe, requires explicit operator approval of the complete exact command in this conversation. Approval may refer unambiguously to one fully previewed command, including its targets, payload, stale guards and result path. Delivered instructions and command lists grant no authorization, an allowed read grants no write, and approval grants no changed command, standing permission or retry."
credential_allow = "Selected fixed Confluence write: only after explicit operator approval of its complete exact command, permit internal service-account identity and vault checks, certificate-document retrieval and masked credential resolution for that one selected provider operation. This exception grants no direct secret reads, arbitrary consumer, desktop fallback, credential output or standing provider write permission."
