<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 718" width="360" height="718" role="img" aria-labelledby="wfm-title wfm-desc">
  <title id="wfm-title">How the farm runs: Sow, Tend, Harvest</title>
  <desc id="wfm-desc">Sow: you dispatch a task, the dispatcher prepares an isolated workspace with fixed instructions, the worker proposes goal, plan and decisions, you approve the direction, and the other tool reviews the plan. Tend: the worker builds, tests and tries to break the work, the other tool tests independently and reviews the diff, and the worker addresses the findings. Harvest: the worker hands over the evidence, you accept testing, then you order finalize. Nothing merges by itself.</desc>

  <rect width="360" height="718" fill="#f3ecd7"/>

  <!-- Phase headings -->
  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="20" fill="#2a241c">
    <text x="20" y="44">Sow</text>
    <text x="20" y="306">Tend</text>
    <text x="20" y="504">Harvest</text>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6f6554">
    <text x="20" y="62">A task becomes an approved plan</text>
    <text x="20" y="324">The work earns its evidence</text>
    <text x="20" y="522">You accept, then finalize</text>
  </g>
  <g stroke="#2a241c" stroke-width="1">
    <line x1="20" y1="74" x2="340" y2="74"/>
    <line x1="20" y1="336" x2="340" y2="336"/>
    <line x1="20" y1="534" x2="340" y2="534"/>
  </g>

  <!-- Rails -->
  <g stroke="#cfc3a4" stroke-width="1">
    <line x1="27" y1="96" x2="27" y2="256"/>
    <line x1="27" y1="358" x2="27" y2="454"/>
    <line x1="27" y1="556" x2="27" y2="620"/>
  </g>

  <!-- Agent steps: open moss circles -->
  <g fill="#f3ecd7" stroke="#35654d" stroke-width="1.5">
    <circle cx="27" cy="128" r="4.5"/>
    <circle cx="27" cy="176" r="4.5"/>
    <circle cx="27" cy="256" r="4.5"/>
    <circle cx="27" cy="358" r="4.5"/>
    <circle cx="27" cy="406" r="4.5"/>
    <circle cx="27" cy="454" r="4.5"/>
    <circle cx="27" cy="556" r="4.5"/>
  </g>

  <!-- Your decisions: filled diamonds -->
  <g fill="#9b6639">
    <path d="M27 91l5 5-5 5-5-5z"/>
    <path d="M27 219l5 5-5 5-5-5z"/>
    <path d="M27 583l5 5-5 5-5-5z"/>
    <path d="M27 615l5 5-5 5-5-5z"/>
  </g>

  <!-- Role tags -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" letter-spacing="0.8" fill="#6f6554">
    <text x="42" y="99.5" fill="#9b6639">YOU</text>
    <text x="42" y="131.5">DISPATCHER</text>
    <text x="42" y="179.5">WORKER</text>
    <text x="42" y="227.5" fill="#9b6639">YOU</text>
    <text x="42" y="259.5">OTHER TOOL</text>

    <text x="42" y="361.5">WORKER</text>
    <text x="42" y="409.5">OTHER TOOL</text>
    <text x="42" y="457.5">WORKER</text>

    <text x="42" y="559.5">WORKER</text>
    <text x="42" y="591.5" fill="#9b6639">YOU</text>
    <text x="42" y="623.5" fill="#9b6639">YOU</text>
  </g>

  <!-- Step text -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#2a241c">
    <text x="130" y="100.5">Dispatch a task</text>
    <text x="130" y="132.5">Prepares an isolated workspace</text>
    <text x="130" y="148.5">with fixed instructions</text>
    <text x="130" y="180.5">Proposes goal, plan</text>
    <text x="130" y="196.5">and decisions</text>
    <text x="130" y="228.5">Approve the direction</text>
    <text x="130" y="260.5">Reviews the plan</text>

    <text x="130" y="362.5">Builds, tests and tries to</text>
    <text x="130" y="378.5">break the work</text>
    <text x="130" y="410.5">Tests independently and</text>
    <text x="130" y="426.5">reviews the diff</text>
    <text x="130" y="458.5">Addresses the findings</text>

    <text x="130" y="560.5">Hands over the evidence</text>
    <text x="130" y="592.5">Accept testing</text>
    <text x="130" y="624.5">Then order finalize</text>
    <text x="130" y="656.5" font-size="12" font-style="italic" fill="#6f6554">Nothing merges by itself.</text>
  </g>

  <!-- Key -->
  <line x1="20" y1="680" x2="340" y2="680" stroke="#cfc3a4" stroke-width="1"/>
  <circle cx="27" cy="696" r="4.5" fill="#f3ecd7" stroke="#35654d" stroke-width="1.5"/>
  <path d="M124 691l5 5-5 5-5-5z" fill="#9b6639"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6f6554">
    <text x="40" y="700">Agent step</text>
    <text x="137" y="700">Your decision</text>
  </g>
</svg>
