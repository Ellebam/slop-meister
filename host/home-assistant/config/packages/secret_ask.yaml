# The panel submits a decision for the request it displays. The broker validates user context and the action token.
panel_custom:
  - name: secret-ask-panel
    sidebar_title: Secret approvals
    sidebar_icon: mdi:key
    url_path: secret-ask
    # Home Assistant serves /local with a 31-day cache, so bump the query when the script changes.
    module_url: /local/secret-ask.js?v=2

script:
  secret_ask_decide:
    alias: Decide a secret request
    mode: parallel
    max: 16
    fields:
      action:
        required: true
        selector:
          text:
    sequence:
      - event: secret_ask_decision
        event_data:
          action: "{{ action }}"

# Approval actions belong to live requests, never recorder history.
recorder:
  exclude:
    entities:
      - sensor.secret_ask
