# The approval route of host/README.md. The integration lives in ../custom_components/secret_approval.
# A tap on a question's notification opens this page. Only the operator's own login reads or decides there.
panel_custom:
  - name: secret-approval-panel
    sidebar_title: Secret approvals
    sidebar_icon: mdi:key
    url_path: secret-approval
    # Home Assistant serves /local with a 31-day cache, so bump the query when the script changes.
    module_url: /local/secret-approval.js?v=1

secret_approval:
  ask_url: !secret secret_approval_route_ask_url
  answer_url: !secret secret_approval_route_answer_url
  credential: !secret secret_approval_route_credential
  # The Home Assistant user ID of the operator. Only a press of this user decides a question.
  operator: !secret secret_approval_route_operator
  devices: !secret secret_approval_route_devices
