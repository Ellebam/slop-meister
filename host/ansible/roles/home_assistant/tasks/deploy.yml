---
# Inspect credentials before protection can change their ownership.
- name: Inspect the locally supplied approval settings without reading them
  ansible.builtin.stat:
    path: "{{ home_assistant_dir }}/config/secrets.yaml"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: home_assistant_approval_secrets

- name: Require protected approval settings when present
  ansible.builtin.assert:
    that:
      - >-
        not home_assistant_approval_secrets.stat.exists or
        (home_assistant_approval_secrets.stat.isreg | default(false) and
        home_assistant_approval_secrets.stat.pw_name | default('') == 'root' and
        home_assistant_approval_secrets.stat.mode | default('') == '0600' and
        home_assistant_approval_secrets.stat.size | default(0) > 0)
    fail_msg: Supply a root-owned regular secrets.yaml with mode 0600 at the host desk.

- name: Inspect whether the approval package was installed before
  ansible.builtin.stat:
    path: "{{ home_assistant_dir }}/config/packages/secret_approval.yaml"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: home_assistant_approval_package

- name: Refuse to restart an existing route without its settings
  ansible.builtin.assert:
    that:
      - home_assistant_approval_secrets.stat.exists or not home_assistant_approval_package.stat.exists
    fail_msg: Restore the route settings at the host desk before redeploying.

- name: Protect approval channel storage
  ansible.builtin.import_tasks: protect.yml

- name: Install the compose file
  ansible.builtin.copy:
    src: "{{ home_assistant_service_dir }}/compose.yaml"
    dest: "{{ home_assistant_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Install the non-secret time zone setting
  ansible.builtin.copy:
    dest: "{{ home_assistant_dir }}/.env"
    content: "HA_TIME_ZONE={{ home_assistant_time_zone }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Install the authored configuration
  ansible.builtin.copy:
    src: "{{ home_assistant_service_dir }}/config/{{ item }}"
    dest: "{{ home_assistant_dir }}/config/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  loop: [configuration.yaml, custom_components, www]
  notify: Restart Home Assistant

- name: Enable approvals only after the operator supplies protected settings
  ansible.builtin.copy:
    src: "{{ home_assistant_service_dir }}/config/packages/secret_approval.yaml"
    dest: "{{ home_assistant_dir }}/config/packages/secret_approval.yaml"
    owner: root
    group: root
    mode: "0644"
  when: home_assistant_approval_secrets.stat.exists
  notify: Restart Home Assistant

- name: Remove the retired approval panel files
  ansible.builtin.file:
    path: "{{ home_assistant_dir }}/config/{{ item }}"
    state: absent
  loop: [packages/secret_ask.yaml, www/secret-ask.js]
  notify: Restart Home Assistant

- name: Seed the UI-owned files the host does not have yet
  ansible.builtin.copy:
    src: "{{ home_assistant_service_dir }}/ui/{{ item }}"
    dest: "{{ home_assistant_dir }}/config/{{ item }}"
    owner: root
    group: root
    mode: "0644"
    force: false
  loop: [automations.yaml, scenes.yaml, scripts.yaml]
  notify: Restart Home Assistant

- name: Start Home Assistant, recreated when the compose file changed
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ home_assistant_dir }}"
  register: home_assistant_up
  changed_when: home_assistant_up.stderr is search('Created|Recreated|Started')

- name: Restart now when the configuration changed
  ansible.builtin.meta: flush_handlers

- name: Wait for the frontend
  ansible.builtin.uri:
    url: http://localhost:8123/
    timeout: 4
    return_content: true
  register: home_assistant_frontend
  until: "'<title>Home Assistant</title>' in home_assistant_frontend.content | default('')"
  retries: 24
  delay: 5
  when: not ansible_check_mode

- name: Install the private tailnet HTTPS route
  ansible.builtin.import_tasks: https.yml
